name: CI

on:
  pull_request:
    paths:
      - "**/*.py"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
      - "resources/**"
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
      - "resources/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre_job:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          cancel_others: "true"
          concurrent_skipping: "same_content_newer"
          skip_after_successful_duplicate: "true"
          paths: '["**/*.py", "requirements.txt", ".github/workflows/ci.yml", "resources/**"]'

  test:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run quick tests
        run: pytest -q -k "not server and not multiplayer and not timing and not multiprocess and not recursion and not pycharm and not sleep"
