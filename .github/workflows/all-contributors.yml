name: All Contributors

on:
  issue_comment:
    types:
      - created
  pull_request_target:
    types:
      - opened
      - edited

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  all-contributors:
    if: >
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@all-contributors')) ||
      (github.event_name == 'pull_request_target' &&
      contains(github.event.pull_request.body, '@all-contributors'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Run all-contributors
        uses: all-contributors/all-contributors-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALL_CONTRIBUTORS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
