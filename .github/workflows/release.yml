name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Set version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "PZMOD_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            python build.py windows
          elif [ "${{ runner.os }}" = "Linux" ]; then
            python build.py linux
          else
            python build.py macos
          fi

      - name: Set up UPX
        if: runner.os == 'Windows'
        uses: crazy-max/ghaction-setup-upx@v3
        with:
          version: latest

      - name: Compress with UPX
        if: runner.os == 'Windows'
        shell: bash
        run: |
          upx --best --lzma "dist/PZMod Sync/PZMod Sync.exe"

      - name: Package artifacts
        shell: bash
        run: |
          ARTIFACT_BASE="PZMod-Sync-${{ runner.os }}-${{ runner.arch }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            tar -a -c -f "${ARTIFACT_BASE}.zip" -C "dist" "PZMod Sync"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            tar -czf "${ARTIFACT_BASE}.tar.gz" -C "dist" "PZMod Sync"
          else
            cd "dist"
            zip -r "../${ARTIFACT_BASE}.zip" "PZMod Sync.app"
            cd -
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          name: "PZMod Sync v${{ env.VERSION }}"
          files: |
            PZMod-Sync-*.zip
            PZMod-Sync-*.tar.gz
